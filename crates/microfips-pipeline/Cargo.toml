[package]
name = "microfips-pipeline"
version = "0.1.0"
edition = "2021"
description = "Fragmentation + PRBS23-XOR erasure coding pipeline for FIPS over ESP-NOW (no_std)"
license = "MIT"

[dependencies]

[dev-dependencies]
rand = "0.9"

[features]
default = []
std = []

[[test]]
name = "erasure_vectors"
path = "tests/erasure_vectors.rs"

[[test]]
name = "row_weights"
path = "tests/row_weights.rs"

[[test]]
name = "pipeline_tx"
path = "tests/pipeline_tx.rs"

# Debug harness for the GE solver: it flips the std-only GE_TRACE switch, so it
# needs the feature and must be declared with required-features -- otherwise it
# is still built during `cargo test` in the default (no_std) configuration and
# fails the whole run.
[[example]]
name = "dbg_ge"
required-features = ["std"]
